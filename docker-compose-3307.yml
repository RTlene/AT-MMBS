# Docker Compose configuration with MySQL on port 3307
# No version directive to avoid warnings

services:
  # MySQL database service on port 3307
  mysql:
    image: mysql:8.0
    container_name: at-mmbs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: golang_demo
      MYSQL_USER: mmbs_user
      MYSQL_PASSWORD: mmbs_pass123
    ports:
      - "3307:3306"  # External 3307, internal 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - mmbs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application service on port 8080
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: at-mmbs-app
    restart: always
    environment:
      MYSQL_USERNAME: mmbs_user
      MYSQL_PASSWORD: mmbs_pass123
      MYSQL_ADDRESS: mysql:3306  # Internal connection uses 3306
      MYSQL_DATABASE: golang_demo
      JWT_SECRET: your-secret-key-change-this
      PORT: 80
    ports:
      - "8080:80"  # External 8080, internal 80
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mmbs-network

networks:
  mmbs-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local