version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: at-mmbs-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-golang_demo}
      MYSQL_USER: ${MYSQL_USER:-mmbs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mmbs_pass123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - mmbs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: at-mmbs-app
    restart: always
    environment:
      MYSQL_USERNAME: ${MYSQL_USER:-mmbs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mmbs_pass123}
      MYSQL_ADDRESS: mysql:3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-golang_demo}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      PORT: 80
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mmbs-network

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: at-mmbs-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    networks:
      - mmbs-network

# 网络配置
networks:
  mmbs-network:
    driver: bridge

# 数据卷配置
volumes:
  mysql_data:
    driver: local